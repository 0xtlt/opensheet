name: Release

# Pushing a tag `vX.Y.Z` tests the code, builds OpenSheet for every platform and publishes a
# GitHub release with an installer per platform (a disk image on macOS, a setup program on
# Windows, .deb and .rpm packages on Linux), portable archives, their checksums and build
# provenance attestations. The release says what CHANGELOG.md says of that version.
#
# Running the workflow by hand ("Run workflow") does the same without publishing: the files
# are kept as artifacts of the run. Use it to try the builds before tagging.
#
# Signing: with the secrets CERTIFICATE_BASE64 and CERTIFICATE_PASSWORD (a Developer ID
# Application certificate), APPLE_ID, APPLE_ID_PASSWORD and APPLE_TEAM_ID (or an App Store
# Connect API key instead of the Apple ID), the macOS app is signed and notarized;
# packaging/macos/package.sh says what each one is. Without them it is signed ad hoc.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  test:
    name: Test
    # The test suite drives the interface headlessly and is checked on macOS.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust

      - name: Check that the tag is the version of the crate
        if: github.ref_type == 'tag'
        run: |
          version=$(cargo metadata --no-deps --locked --format-version 1 \
            | jq -r '.packages[] | select(.name == "opensheet") | .version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error file=Cargo.toml::the tag $GITHUB_REF_NAME does not match the version $version"
            exit 1
          fi

      # Before anything is built: its section is what the release will say.
      - name: Check that the changelog has the version
        if: github.ref_type == 'tag'
        run: |
          if ! tools/release/notes.sh "$GITHUB_REF_NAME"; then
            echo "::error file=CHANGELOG.md::the changelog has no section for $GITHUB_REF_NAME"
            exit 1
          fi

      # GPUI compiles its Metal shaders; recent Xcodes download that compiler on demand.
      - name: Metal toolchain
        run: xcrun -f metal > /dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain

      - name: Test
        run: cargo test --locked -p opensheet_engine -p opensheet_io -p opensheet_print -p opensheet_script -p opensheet

      - name: Check the translations
        run: python3 scripts/check_i18n.py

  build:
    name: Build ${{ matrix.target }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            smoke: true
          - target: x86_64-apple-darwin
            os: macos-latest
          # GPUI links the system's windowing libraries (Wayland, X11, Vulkan): Linux is built
          # natively, on an x86-64 and an ARM runner.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            smoke: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            smoke: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            smoke: true
          - target: aarch64-pc-windows-msvc
            os: windows-latest
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}

      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config clang libasound2-dev libfontconfig-dev \
            libfreetype-dev libwayland-dev libx11-dev libx11-xcb-dev libxcb1-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libvulkan-dev libssl-dev libzstd-dev \
            desktop-file-utils
      - name: Metal toolchain
        if: runner.os == 'macOS'
        run: xcrun -f metal > /dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
      - name: Packaging tools
        if: runner.os == 'Linux'
        run: cargo install --locked cargo-deb@3.8.0 cargo-generate-rpm@0.21.0
      - name: Packaging tools
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y

      - name: Build
        run: cargo build --release --locked -p opensheet --target "$TARGET"

      # Only where the runner can execute what it built. `--export` converts a workbook
      # without opening a window.
      - name: Smoke test
        if: matrix.smoke
        run: |
          opensheet="target/$TARGET/release/opensheet"
          "$opensheet" --version
          "$opensheet" --demo --export demo.xlsx
          "$opensheet" demo.xlsx --export demo.csv
          head -3 demo.csv

      - name: Package
        if: runner.os != 'Windows'
        env:
          MACOS_CERTIFICATE: ${{ secrets.CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          mkdir -p dist
          if [ "$RUNNER_OS" = "macOS" ]; then
            scripts/bundle.sh release "$TARGET"
            packaging/macos/package.sh "$TARGET"
          else
            tar -czf "dist/opensheet-$TARGET.tar.gz" -C "target/$TARGET/release" opensheet
            cargo deb -p opensheet --target "$TARGET" --no-build --output "dist/opensheet-$TARGET.deb"
            cargo generate-rpm -p crates/app --target "$TARGET" --output "dist/opensheet-$TARGET.rpm"
          fi

      # The setup program, and the bare executable in a zip for those who cannot install.
      - name: Package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $version = (cargo metadata --no-deps --locked --format-version 1 | ConvertFrom-Json).packages |
            Where-Object name -eq opensheet | ForEach-Object version
          $arch = if ($env:TARGET -like "aarch64-*") { "arm64" } else { "x64compatible" }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DVersion=$version" "/DTarget=$env:TARGET" "/DArch=$arch" packaging\windows\opensheet.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path "target\$env:TARGET\release\opensheet.exe" -DestinationPath "dist\opensheet-$env:TARGET.zip"

      # The installers install what they should, where the runner can run it.
      - name: Try the installer
        if: matrix.smoke && runner.os == 'Linux'
        run: |
          sudo apt-get install -y "./dist/opensheet-$TARGET.deb"
          opensheet --version
          desktop-file-validate /usr/share/applications/org.opensheet.OpenSheet.desktop
          rpm -qlp "dist/opensheet-$TARGET.rpm" 2> /dev/null || true
      - name: Try the installer
        if: matrix.smoke && runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Start-Process "dist\opensheet-$env:TARGET-setup.exe" -Wait -PassThru `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/CURRENTUSER", "/NORESTART"
          if ($setup.ExitCode -ne 0) { exit $setup.ExitCode }
          $run = Start-Process "$env:LOCALAPPDATA\Programs\OpenSheet\opensheet.exe" -ArgumentList "--version" `
            -Wait -PassThru -NoNewWindow -RedirectStandardOutput version.txt
          Get-Content version.txt
          if ($run.ExitCode -ne 0) { exit $run.ExitCode }
          Get-ItemProperty "HKCU:\Software\Classes\.xlsx\OpenWithProgids" | Out-Host
      - name: Try the installer
        if: matrix.smoke && runner.os == 'macOS'
        run: |
          hdiutil attach "dist/opensheet-$TARGET.dmg" -mountpoint /tmp/opensheet-dmg -nobrowse
          /tmp/opensheet-dmg/OpenSheet.app/Contents/MacOS/opensheet --version
          codesign --verify --deep --strict /tmp/opensheet-dmg/OpenSheet.app
          hdiutil detach /tmp/opensheet-dmg

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opensheet-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish the release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Build provenance: `gh attestation verify <file> --repo 0xtlt/opensheet`.
      id-token: write
      attestations: write
    steps:
      # For the changelog.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: opensheet-*
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum opensheet-* > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/opensheet-*

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # A re-run of a release that already exists replaces its files.
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            exit 0
          fi
          # `v1.2.0-rc.1` and the like are prereleases.
          flags=()
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          # What the changelog says of the version, then the link to the commits that GitHub
          # writes. Without pull requests, that link is all GitHub has to say.
          {
            tools/release/notes.sh "$TAG"
            echo
            gh api "repos/$GH_REPO/releases/generate-notes" -f tag_name="$TAG" --jq .body
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" dist/* --verify-tag --notes-file "$RUNNER_TEMP/notes.md" --title "$TAG" "${flags[@]}"

  # The cask of the Homebrew tap (`brew install 0xtlt/tap/opensheet`), with a token that can
  # write to 0xtlt/homebrew-tap in the secret HOMEBREW_TAP_TOKEN; without it, a warning.
  homebrew:
    name: Update the Homebrew tap
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Update Casks/opensheet.rb
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: tools/release/update-homebrew-tap.sh
