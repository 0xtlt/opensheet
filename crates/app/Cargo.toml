[package]
name = "opensheet"
description = "An open-source spreadsheet with a familiar ribbon interface, built with Rust and GPUI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
opensheet_engine = { path = "../engine" }
opensheet_io = { path = "../io" }
opensheet_print = { path = "../print" }
opensheet_script = { path = "../script" }
gpui = "0.2.2"
# The channel that carries the files the system asks to open (GPUI's own
# dependency).
futures = "0.3"
# The crate GPUI decodes pictures with (already built for it): its bitmap
# type is what `gpui::RenderImage` is made from.
image = "0.25"
unicode-segmentation = "1"
# The languages the user prefers, as the system lists them (CoreFoundation on
# macOS, which honours the language chosen for OpenSheet alone; the user's
# interface languages on Windows; LANGUAGE / LC_* / LANG elsewhere).
sys-locale = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
# The Objective-C runtime GPUI already links: for the system spelling
# checker (NSSpellChecker) of Review > Spelling, and for the share sheet of
# macOS (NSSharingServicePicker), which hangs from the view of the window
# (`raw-window-handle`, also built for GPUI already).
objc = "0.2"
raw-window-handle = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
# Not used directly: GPUI's tar reader depends on xattr 0.2, which reads
# `libc::ENOATTR`, a constant libc 0.2.190 no longer has on Linux. Keep the
# last libc that has it until GPUI moves on.
libc = "=0.2.189"

[dev-dependencies]
# The headless window of GPUI, to drive the interface in tests.
gpui = { version = "0.2.2", features = ["test-support"] }
