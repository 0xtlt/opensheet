[package]
name = "opensheet_script"
description = "Office Scripts for OpenSheet: runs the TypeScript `main(workbook)` of a script on a workbook"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
opensheet_engine = { path = "../engine" }
# Numbers cross between the script and the workbook as JSON text: they
# must come back as the same number.
serde_json = { version = "1", features = ["float_roundtrip"] }
# QuickJS, built from its C sources by `cc` (no system library).
rquickjs = "=0.14.0"
# TypeScript to JavaScript, with the source map errors are placed by.
oxc = { version = "=0.154.0", features = ["transformer", "codegen", "semantic", "ast_visit"] }
